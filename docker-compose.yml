version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: sonora
      POSTGRES_DB: sonora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local dev (swap for R2/S3 in prod)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sonora
      MINIO_ROOT_PASSWORD: sonora123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
