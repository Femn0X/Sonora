name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sonora
          POSTGRES_PASSWORD: sonora
          POSTGRES_DB: sonora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonora -d sonora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sonora:sonora@localhost:5432/sonora?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @sonora/api exec prisma migrate deploy
