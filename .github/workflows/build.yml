name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      DATABASE_URL: postgresql://sonora:sonora@localhost:5432/sonora?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sonora/api exec prisma generate

      - name: Build API
        run: pnpm --filter @sonora/api build

      - name: Build web app
        run: pnpm --filter @sonora/web build

      # These are web/API build outputs, not native desktop installers.
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: sonora-build-${{ matrix.os }}
          path: |
            apps/api/dist/
            apps/web/.next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
